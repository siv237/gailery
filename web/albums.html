<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Альбомы — Gailery</title>
<link rel="stylesheet" href="/shared.css">
<style>
body { font-family: monospace; background: #0d1117; color: #c9d1d9; }
.light-theme { background: #ffffff; color: #24292f; }
</style>
</head>
<body>

<script src="/shared.js"></script>
<script>renderHeader('Альбомы');</script>

<div class="search-bar">
  <button onclick="generate()">Сгенерировать</button>
  <button class="btn-secondary" onclick="clearAll()">Очистить все</button>
  <span class="info-bar" style="padding:0;border:none;background:none;flex:1" id="albumCount"></span>
</div>

<div id="content">
  <div class="empty">
    <p>Нет альбомов</p>
    <p>Нажмите «Сгенерировать» для авто-создания</p>
  </div>
</div>

<script>
let currentAlbum = null;

async function loadAlbums() {
  const resp = await fetch('/api/albums/');
  const albums = await resp.json();
  document.getElementById('albumCount').textContent = albums.length + ' альбомов';

  if (!albums.length) {
    document.getElementById('content').innerHTML = '<div class="empty"><p>Нет альбомов</p><p>Нажмите «Сгенерировать» для авто-создания</p></div>';
    return;
  }

  const html = '<div class="grid">' + albums.map(a => {
    const cover = a.cover_photo_id
      ? `<img src="/api/photos/thumbnail?path=${a.cover_photo_id}&size=md" loading="lazy">`
      : '';
    const date = a.date_start ? a.date_start.slice(0,10) : '';
    const desc = escapeHtml(a.title);
    const meta = `${a.photo_count} фото · ${date} · ${escapeHtml(a.source)}`;
    return `<div class="card" onclick="openAlbum('${a.album_id}')">
      ${cover}
      <div class="overlay">
        <div class="desc">${desc}</div>
        <div class="date">${meta}</div>
      </div>
    </div>`;
  }).join('') + '</div>';

  document.getElementById('content').innerHTML = html;
}

async function openAlbum(id) {
  const resp = await fetch('/api/albums/' + id);
  const album = await resp.json();
  currentAlbum = album;

  let photosHtml = '';
  if (album.photo_ids && album.photo_ids.length) {
    photosHtml = '<div class="grid">' + album.photo_ids.map(pid =>
      `<div class="card" onclick="openPhoto('${pid}')"><img src="/api/photos/thumbnail?path=${pid}&size=sm" loading="lazy"></div>`
    ).join('') + '</div>';
  } else {
    photosHtml = '<div class="empty"><p>В альбоме нет фото</p></div>';
  }

  const meta = `${album.photo_count} фото · ${album.date_start ? album.date_start.slice(0,10) : ''} — ${album.date_end ? album.date_end.slice(0,10) : ''} · ${escapeHtml(album.source)}`;
  document.getElementById('content').innerHTML = `
    <div class="search-bar">
      <button class="btn-secondary" onclick="loadAlbums()">← Все альбомы</button>
      <span class="info-bar" style="padding:0;border:none;background:none;flex:1">${escapeHtml(album.title)} · ${meta}</span>
    </div>
    ${photosHtml}
  `;
}

function openPhoto(pid) {
  window.open('/api/photos/?path=' + pid, '_blank');
}

async function generate() {
  document.getElementById('albumCount').textContent = 'Генерация...';
  const resp = await fetch('/api/albums/generate', {method:'POST'});
  const data = await resp.json();
  if (data.ok) {
    alert('Создано альбомов: ' + data.created);
    loadAlbums();
  } else {
    alert('Ошибка: ' + JSON.stringify(data));
  }
}

async function clearAll() {
  if (!confirm('Удалить все альбомы?')) return;
  const resp = await fetch('/api/albums/clear', {method:'DELETE'});
  const data = await resp.json();
  if (data.ok) {
    loadAlbums();
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

loadAlbums();
</script>
</body>
</html>
