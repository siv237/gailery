<style>

/* ─── Album card stack effect (real photos) ─── */
.grid-albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px; padding: 24px 20px; }
.grid-albums .month-divider { grid-column: 1 / -1; padding: 10px 0 4px 2px; margin-bottom: 6px; font-size: 13px; }

.album-card { position: relative; cursor: pointer; }
.ac-photo { position: absolute; inset: 0; border-radius: 4px; overflow: hidden; background: #161b22; border: 1px solid #30363d; transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease; }
.ac-photo img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #21262d; }
.ac-photo .ac-no-cover { width: 100%; aspect-ratio: 1; background: #21262d; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #30363d; }
.ac-photo .ac-count { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.8); color: #c9d1d9; font-size: 11px; padding: 2px 8px; border-radius: 10px; z-index: 4; font-weight: 600; }
.ac-photo .ac-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px; background: linear-gradient(transparent, rgba(0,0,0,.85)); font-size: 10px; line-height: 1.4; z-index: 3; pointer-events: none; }
.ac-photo .ac-overlay .date { color: #8b949e; }
.ac-photo .ac-overlay .desc { color: #c9d1d9; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ac-spread { position: relative; width: 100%; aspect-ratio: 1; }
.ac-back-2 { z-index: 0; transform: translate(6px, 6px) rotate(-2.5deg); }

<script>renderHeader('Альбомы', '<div class="search-bar">\

<script>
var API = '/api';
var currentPhotos = [];

function videoSrc(p) {
    if (p.media_type === 'video' && p.needs_stream) {
        return API + '/photos/video_stream?path=' + encodeURIComponent(p.photo_id);
    }
    return p.photo_id ? (API + '/photos/?path=' + encodeURIComponent(p.photo_id)) : '';
}

function showReprocessModal(photoId) {
    alert('Переобработка доступна в галерее');
}

var currentAlbum = null;
var albumViewMode = false;

var MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function _albumMonthKey(dateStr) {
    if (!dateStr) return '';
    return dateStr.substring(0, 7);
}

function _albumMonthAgoLabel(year, month) {
    var now = new Date();
    var target = new Date(year, month - 1, 1);
    var daysAgo = Math.floor((now - target) / 86400000);
    if (daysAgo <= 0) return '';
    if (daysAgo < 30) {
        function dayWord(n) {
            if (n === 1) return '1 день';
            if (n >= 2 && n <= 4) return n + ' дня';
            return n + ' дней';
        }
        return dayWord(daysAgo) + ' назад';
    }
    var monthsAgo = (now.getFullYear() - year) * 12 + (now.getMonth() + 1 - month);
    if (monthsAgo < 12) {
        function monthWord(n) {
            if (n === 1) return '1 месяц';
            if (n >= 2 && n <= 4) return n + ' месяца';
            return n + ' месяцев';
        }
        return monthWord(monthsAgo) + ' назад';
    }
    var years = Math.floor(monthsAgo / 12);
    var remM = monthsAgo % 12;
    if (remM >= 6) years++;
    function yearWord(n) {
        if (n === 1) return '1 год';
        if (n >= 2 && n <= 4) return n + ' года';
        return n + ' лет';
    }
    return yearWord(years) + ' назад';
}

function _albumMonthDividerHtml(dateStr) {
    var key = _albumMonthKey(dateStr);
    if (!key) return '';
    var y = key.substring(0, 4);
    var m = parseInt(key.substring(5, 7), 10);
    var ago = _albumMonthAgoLabel(parseInt(y, 10), m);
    var agoHtml = ago ? '<span class="md-ago">' + esc(ago) + '</span>' : '';
    return '<div class="month-divider" data-month="' + key + '"><span class="md-year">' + esc(y) + '</span><span class="md-month">' + MONTH_NAMES[m - 1] + '</span>' + agoHtml + '</div>';
}

function _albumCardHtml(a) {
    var previews = a.preview_photos || [];
    var date = a.date_start ? a.date_start.slice(0,10) : '';
    var desc = esc(a.title);
    var meta = a.photo_count + ' фото · ' + date + ' · ' + esc(a.source);
    var classes = ['ac-front', 'ac-back-1', 'ac-back-2'];
    var photosHtml = '';
    for (var i = 0; i < previews.length && i < 3; i++) {
      var pid = previews[i];
      var img = '<img src="/api/photos/thumbnail?path=' + encodeURIComponent(pid) + '&size=md" loading="lazy">';
      var overlay = i === 0
        ? '<div class="ac-count">' + a.photo_count + '</div>' +
          '<div class="ac-overlay"><div class="desc">' + desc + '</div><div class="date">' + meta + '</div></div>'
        : '';
      photosHtml += '<div class="ac-photo ' + classes[i] + '" onclick="event.stopPropagation();openAlbum(\'' + a.album_id + '\')">' + img + overlay + '</div>';
    }
    if (!photosHtml) {
      photosHtml = '<div class="ac-photo ac-front"><div class="ac-no-cover">&#128247;</div><div class="ac-count">' + a.photo_count + '</div></div>';
    }
    return '<div class="album-card" onclick="openAlbum(\'' + a.album_id + '\')"><div class="ac-spread">' + photosHtml + '</div></div>';
}

var currentTab = 'auto';

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabAuto').classList.toggle('active', tab === 'auto');
  document.getElementById('tabManual').classList.toggle('active', tab === 'manual');
  document.getElementById('autoActions').style.display = tab === 'auto' ? '' : 'none';
  document.getElementById('manualActions').style.display = tab === 'manual' ? '' : 'none';
  loadAlbums();
}

function createAlbumDialog() {
  document.getElementById('createAlbumTitle').value = '';
  document.getElementById('createAlbumDesc').value = '';
  document.getElementById('createAlbumModal').classList.add('show');
  setTimeout(function() { document.getElementById('createAlbumTitle').focus(); }, 100);
}

function closeCreateAlbum() {
  document.getElementById('createAlbumModal').classList.remove('show');
}

async function createAlbumSubmit() {
  var title = document.getElementById('createAlbumTitle').value.trim();
  if (!title) return;
  var desc = document.getElementById('createAlbumDesc').value.trim();
  var resp = await fetch('/api/albums/create', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: title, description: desc})
  });
  var data = await resp.json();
  if (data.ok) {
    closeCreateAlbum();
    if (currentTab !== 'manual') switchTab('manual');
    else loadAlbums();
  }
}

async function loadAlbums() {
  albumViewMode = false;
  currentPhotos = [];
  var resp = await fetch('/api/albums/?source=' + currentTab);
  var albums = await resp.json();
  var el = document.getElementById('albumCount');
  if (el) el.textContent = albums.length + ' альбомов';

  if (!albums.length) {
    var msg = currentTab === 'auto'
      ? '<div class="empty"><p>Нет альбомов</p><p>Нажмите «Сгенерировать» для авто-создания</p></div>'
      : '<div class="empty"><p>Нет ручных альбомов</p><p>Нажмите «Создать альбом»</p></div>';
    document.getElementById('content').innerHTML = msg;
    return;
  }

  if (currentTab === 'manual') {
    var html = '<div style="padding:12px 20px">';
    for (var i = 0; i < albums.length; i++) {
      var a = albums[i];
      var membersResp = await fetch('/api/albums/' + a.album_id + '/members');
      var members = await membersResp.json();
      var personas = members.filter(function(m) { return m.member_type === 'persona'; });
      var subAlbums = members.filter(function(m) { return m.member_type === 'album'; });
      var photoOnly = members.filter(function(m) { return m.member_type === 'photo'; });
      var summary = '';
      if (personas.length) summary += personas.map(function(m) { return '\u{1F464} ' + esc(m.member_label); }).join(' \u00B7 ');
      if (subAlbums.length) summary += (summary ? ' \u00B7 ' : '') + subAlbums.length + ' альбомов';
      if (photoOnly.length) summary += (summary ? ' \u00B7 ' : '') + photoOnly.length + ' фото';
      if (!summary) summary = a.photo_count + ' фото';
      html += '<div class="manual-album-bar" onclick="openManualAlbum(\'' + esc(a.album_id) + '\')">' +
        '<div class="mab-title">' + esc(a.title) + '</div>' +
        '<div class="mab-summary">' + summary + ' \u00B7 ' + a.photo_count + ' фото всего</div>' +
        '</div>';
    }
    html += '</div>';
    document.getElementById('content').innerHTML = html;
    return;
  }

  var html = '<div class="grid-albums">';
  var lastMonth = null;
  for (var i = 0; i < albums.length; i++) {
    var a = albums[i];
    var mk = _albumMonthKey(a.date_start || '');
    if (mk && mk !== lastMonth) {
      html += _albumMonthDividerHtml(a.date_start);
      lastMonth = mk;
    }
    html += _albumCardHtml(a);
  }
  html += '</div>';

  document.getElementById('content').innerHTML = html;
  _initAlbumStackThrottle();
}

var _acLastSwitch = 0;
function _initAlbumStackThrottle() {
  var cards = document.querySelectorAll('.album-card');
  for (var i = 0; i < cards.length; i++) {
    (function(card) {
      var photos = card.querySelectorAll('.ac-photo');
      for (var j = 0; j < photos.length; j++) {
        photos[j].addEventListener('mouseenter', function() {
          var now = Date.now();
          if (now - _acLastSwitch < 300) return;
          _acLastSwitch = now;
          for (var k = 0; k < photos.length; k++) photos[k].classList.remove('ac-active');
          this.classList.add('ac-active');
        });
      }
      card.addEventListener('mouseleave', function() {
        for (var k = 0; k < photos.length; k++) photos[k].classList.remove('ac-active');
        _acLastSwitch = 0;
      });
    })(cards[i]);
  }
}

async function openManualAlbum(id) {
  albumViewMode = true;
  var resp = await fetch('/api/albums/' + id + '?full=false');
  var album = await resp.json();
  currentAlbum = album;

  var membersResp = await fetch('/api/albums/' + id + '/members');
  var members = await membersResp.json();
  var albumMembers = members.filter(function(m) { return m.member_type === 'album'; });
  var personaMembers = members.filter(function(m) { return m.member_type === 'persona'; });

  var html = '<div class="album-bar">' +
    '<button class="btn-secondary" onclick="switchTab(\'manual\')">&#8592;</button>' +
    '<span class="album-bar-title" id="albumBarTitle" onclick="editAlbumTitle()" title="\u041a\u043b\u0438\u043a \u0434\u043b\u044f \u0440\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f">' + esc(album.title) + '</span>' +
    '<span class="album-bar-meta">' + album.photo_count + ' фото \u00b7 ' + albumMembers.length + ' альбомов</span>' +
    '<button class="album-bar-desc-btn" onclick="showAlbumDescModal()">\u041e\u043f\u0438\u0441\u0430\u043d\u0438\u0435</button>' +
    '</div>';

  if (personaMembers.length) {
    html += '<div class="ma-members-bar"><b>Персоны:</b> ' +
      personaMembers.map(function(m) { return '\u{1F464} ' + esc(m.member_label) + ' (' + m.photo_count + ')'; }).join(' \u00B7 ') +
      '</div>';
  }

  if (albumMembers.length) {
    var subAlbums = [];
    for (var i = 0; i < albumMembers.length; i++) {
      var subResp = await fetch('/api/albums/' + albumMembers[i].member_id + '?full=false');
      var subAlbum = await subResp.json();
      if (subAlbum && subAlbum.album_id) {
        subAlbums.push(subAlbum);
      }
    }
    subAlbums.sort(function(a, b) {
      return (b.date_start || '').localeCompare(a.date_start || '');
    });
    html += '<div class="grid-albums">';
    var lastMonth = null;
    for (var si = 0; si < subAlbums.length; si++) {
      var sa = subAlbums[si];
      var mk = _albumMonthKey(sa.date_start || '');
      if (mk && mk !== lastMonth) {
        html += _albumMonthDividerHtml(sa.date_start);
        lastMonth = mk;
      }
      html += _albumCardHtml(sa);
    }
    html += '</div>';
  } else {
    html += '<div class="empty"><p>В альбоме нет подальбомов</p></div>';
  }

  document.getElementById('content').innerHTML = html;
  _initAlbumStackThrottle();
}

async function openAlbum(id) {
  albumViewMode = true;
  var resp = await fetch('/api/albums/' + id + '?full=true');
  var album = await resp.json();
  currentAlbum = album;

  var photos = album.photos || [];
  currentPhotos = photos;

  var isManual = album.source === 'manual';
  var photosHtml = '';

  if (isManual) {
    var membersResp = await fetch('/api/albums/' + id + '/members');
    var members = await membersResp.json();
    var albumMembers = members.filter(function(m) { return m.member_type === 'album'; });
    var photoMembers = members.filter(function(m) { return m.member_type === 'photo'; });
    var personaMembers = members.filter(function(m) { return m.member_type === 'persona'; });

    if (albumMembers.length) {
      photosHtml += '<div class="grid-albums">';
      var lastMonth = null;
      for (var ai = 0; ai < albumMembers.length; ai++) {
        var am = albumMembers[ai];
        var subResp = await fetch('/api/albums/' + am.member_id + '?full=false');
        var subAlbum = await subResp.json();
        if (subAlbum && subAlbum.album_id) {
          photosHtml += _albumCardHtml(subAlbum);
        }
      }
      photosHtml += '</div>';
    }

    var albumPhotoIds = {};
    for (var mi = 0; mi < albumMembers.length; mi++) {
      var subResp2 = await fetch('/api/albums/' + albumMembers[mi].member_id + '?full=false');
      var subAlbum2 = await subResp2.json();
      if (subAlbum2 && subAlbum2.photo_ids) {
        for (var pi = 0; pi < subAlbum2.photo_ids.length; pi++) {
          albumPhotoIds[subAlbum2.photo_ids[pi]] = true;
        }
      }
    }
    var standalonePhotos = photos.filter(function(p) {
      var pid = p.photo_id || p.db_id;
      return !albumPhotoIds[pid];
    });
    if (standalonePhotos.length) {
      photosHtml += '<div class="ma-standalone-title">' + (albumMembers.length ? 'Отдельные фото' : 'Фото') + ' (' + standalonePhotos.length + ')</div>';
      photosHtml += '<div class="grid" id="grid">' + standalonePhotos.map(function(p, idx) {
        return buildCardHtml(p, idx);
      }).join('') + '</div>';
      setTimeout(function() { _faceLoadEnabled = true; _observeThumbs(); }, 500);
    }
    if (!albumMembers.length && !standalonePhotos.length) {
      photosHtml = '<div class="empty"><p>В альбоме нет фото</p></div>';
    }
  } else {
    if (photos.length) {
      photosHtml = '<div class="grid" id="grid">' + photos.map(function(p, idx) {
        return buildCardHtml(p, idx);
      }).join('') + '</div>';
      setTimeout(function() { _faceLoadEnabled = true; _observeThumbs(); }, 500);
    } else {
      photosHtml = '<div class="empty"><p>В альбоме нет фото</p></div>';
    }
  }

  var meta = album.photo_count + ' фото \u00b7 ' + (album.date_start ? album.date_start.slice(0,10) : '') + (album.date_end ? ' \u2014 ' + album.date_end.slice(0,10) : '') + ' \u00b7 ' + esc(album.source === 'manual' ? 'ручной' : 'авто');
  var cameras = album.cameras || [];
  var CAM_COLORS = ['#58a6ff','#f0883e','#3fb950','#d29922','#f85149','#d2a8ff','#e3b341','#8250df'];
  var camerasHtml = '';
  if (cameras.length && !isManual) {
    camerasHtml = '<div class="cam-chips">';
    for (var ci = 0; ci < cameras.length; ci++) {
      var cam = cameras[ci];
      var label = ((cam.make || '') + ' ' + (cam.model || '')).trim();
      if (!label) label = 'Без названия';
      var color = CAM_COLORS[ci % CAM_COLORS.length];
      camerasHtml += '<button class="cam-chip" data-cam="' + ci + '" style="border-color:' + color + ';color:' + color + '" onclick="toggleCamHighlight(' + ci + ')" title="' + esc(cam.serial || '') + '">' + esc(label) + ' <span class="cam-count">' + cam.count + '</span></button>';
    }
    camerasHtml += '</div>';
  }
  var hasDesc = album.description && album.description.trim();
  var descHtml = hasDesc ? '<div class="album-desc-text">' + esc(album.description) + '</div>' : '';
  var removeBtn = isManual ? '<button class="album-bar-desc-btn ma-remove-btn" onclick="removePhotoFromAlbum(\'' + esc(album.album_id) + '\')">Удалить фото из альбома</button>' : '';
  var membersHtml = '';
  if (isManual) {
    membersHtml = '<div id="albumMembers" class="ma-members-bar"></div>';
  }
  document.getElementById('content').innerHTML =
    '<div class="album-bar">' +
    '<button class="btn-secondary" onclick="loadAlbums()">&#8592;</button>' +
    '<span class="album-bar-title" id="albumBarTitle" onclick="editAlbumTitle()" title="\u041a\u043b\u0438\u043a \u0434\u043b\u044f \u0440\u0435\u0434\u0430\u043a\u0442\u043e\u0440\u043e\u0331\u0430\u043d\u0438\u044f">' + esc(album.title) + '</span>' +
    '<span class="album-bar-meta">' + meta + '</span>' +
    camerasHtml +
    '<button class="album-bar-desc-btn" onclick="showAlbumDescModal()">\u041e\u043f\u0438\u0441\u0430\u043d\u0438\u0435' + (hasDesc ? '<span class="album-desc-badge"></span>' : '') + '</button>' +
    removeBtn +
    '</div>' + descHtml + membersHtml + photosHtml;
  if (isManual) loadAlbumMembers(album.album_id);
}

async function loadAlbumMembers(albumId) {
  try {
    var resp = await fetch('/api/albums/' + albumId + '/members');
    var members = await resp.json();
    var el = document.getElementById('albumMembers');
    if (!el) return;
    if (!members.length) { el.innerHTML = '<span class="muted-text">Состав: отдельные фото</span>'; return; }
    var parts = ['<b>Состав:</b> '];
    for (var i = 0; i < members.length; i++) {
      var m = members[i];
      var icon = m.member_type === 'persona' ? '\u{1F464}' : m.member_type === 'album' ? '\u{1F4C1}' : '\u{1F4F7}';
      var label = m.member_label || m.member_id;
      parts.push(icon + ' ' + esc(label) + ' <span class="muted-text">(' + m.photo_count + ')</span>');
    }
    el.innerHTML = parts.join(' \u00B7 ');
  } catch(e) {}
}

var _camActiveIdx = -1;
function toggleCamHighlight(idx) {
  var chips = document.querySelectorAll('.cam-chip');
  if (_camActiveIdx === idx) {
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove('active');
    var cards = document.querySelectorAll('.card[data-cam-idx]');
    for (var j = 0; j < cards.length; j++) {
      cards[j].classList.remove('cam-hl-0','cam-hl-1','cam-hl-2','cam-hl-3','cam-hl-4','cam-hl-5','cam-hl-6','cam-hl-7');
    }
    _camActiveIdx = -1;
    return;
  }
  for (var i = 0; i < chips.length; i++) chips[i].classList.remove('active');
  var chip = document.querySelector('.cam-chip[data-cam="' + idx + '"]');
  if (chip) chip.classList.add('active');
  var cards = document.querySelectorAll('.card[data-cam-idx]');
  for (var j = 0; j < cards.length; j++) {
    for (var c = 0; c < 8; c++) cards[j].classList.remove('cam-hl-' + c);
    if (cards[j].dataset.camIdx === String(idx)) {
      cards[j].classList.add('cam-hl-' + idx);
    }
  }
  _camActiveIdx = idx;
}

function editAlbumTitle() {
  var span = document.getElementById('albumBarTitle');
  if (!span || !currentAlbum) return;
  var t = currentAlbum.title || '';
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'album-bar-title-input'; inp.value = t; inp.id = 'albumBarTitle';
  span.parentNode.replaceChild(inp, span);
  inp.focus(); inp.select();
  inp.addEventListener('blur', function() { saveAlbumTitle(); });
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    if (e.key === 'Escape') { inp.value = t; inp.blur(); }
  });
}

function saveAlbumTitle() {
  var inp = document.getElementById('albumBarTitle');
  if (!inp || !currentAlbum || inp.tagName !== 'INPUT') return;
  var nt = inp.value.trim();
  if (!nt || nt === currentAlbum.title) { _restAT(currentAlbum.title || ''); return; }
  fetch('/api/albums/' + encodeURIComponent(currentAlbum.album_id), {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title: nt})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) { currentAlbum.title = nt; _restAT(nt); }
    else _restAT(currentAlbum.title || '');
  }).catch(function() { _restAT(currentAlbum.title || ''); });
}

function _restAT(t) {
  var inp = document.getElementById('albumBarTitle');
  if (!inp || inp.tagName !== 'INPUT') return;
  var sp = document.createElement('span');
  sp.className = 'album-bar-title'; sp.id = 'albumBarTitle';
  sp.title = '\u041a\u043b\u0438\u043a \u0434\u043b\u044f \u0440\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f';
  sp.setAttribute('onclick', 'editAlbumTitle()'); sp.textContent = t;
  inp.parentNode.replaceChild(sp, inp);
}

function showAlbumDescModal() {
  var m = document.getElementById('albumDescModal');
  var i = document.getElementById('albumDescInput');
  if (!m || !i || !currentAlbum) return;
  i.value = currentAlbum.description || '';
  m.classList.add('show');
  setTimeout(function() { i.focus(); }, 100);
}

function closeAlbumDescModal() {
  var m = document.getElementById('albumDescModal');
  if (m) m.classList.remove('show');
}

function saveAlbumDesc() {
  var i = document.getElementById('albumDescInput');
  if (!i || !currentAlbum) return;
  var desc = i.value.trim();
  fetch('/api/albums/' + encodeURIComponent(currentAlbum.album_id), {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({description: desc})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) { currentAlbum.description = desc; closeAlbumDescModal(); openAlbum(currentAlbum.album_id); }
  }).catch(function(e) { alert('\u041e\u0448\u0438\u0431\u043a\u0430: ' + e.message); });
}

async function generate() {
  var el = document.getElementById('albumCount');
  if (el) el.textContent = 'Генерация...';
  var resp = await fetch('/api/albums/generate', {method:'POST'});
  var data = await resp.json();
  if (data.ok) {
    alert('Создано альбомов: ' + data.created);
    loadAlbums();
  } else {
    alert('Ошибка: ' + JSON.stringify(data));
  }
}

async function clearAll() {
  if (!confirm('Удалить все альбомы?')) return;
  var resp = await fetch('/api/albums/clear', {method:'DELETE'});
  var data = await resp.json();
  if (data.ok) {
    loadAlbums();
  }
}

var _removeFromAlbumId = null;
var _removeFromAlbumPhotos = [];

function removePhotoFromAlbum(albumId) {
  if (!currentAlbum || currentAlbum.album_id !== albumId) return;
  _removeFromAlbumId = albumId;
  _removeFromAlbumPhotos = currentPhotos || [];
  if (!_removeFromAlbumPhotos.length) return;
  var photoIds = _removeFromAlbumPhotos.map(function(p) { return p.photo_id || p.db_id; });
  var html = '<div style="max-width:600px;margin:0 auto;padding:20px">' +
    '<h3 class="modal-title">Выберите фото для удаления из альбома</h3>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:16px 0">';
  for (var i = 0; i < _removeFromAlbumPhotos.length; i++) {
    var p = _removeFromAlbumPhotos[i];
    var pid = p.photo_id || p.db_id;
    var thumb = API + '/photos/thumbnail?path=' + encodeURIComponent(pid) + '&size=sm';
    html += '<label style="cursor:pointer;text-align:center">' +
      '<div style="position:relative"><img src="' + thumb + '" style="width:100%;height:80px;object-fit:cover;border-radius:4px">' +
      '<input type="checkbox" value="' + esc(pid) + '" style="position:absolute;top:4px;right:4px"></div></label>';
  }
  html += '</div><div style="text-align:center"><button class="btn-danger" onclick="_doRemoveFromAlbum()">Удалить выбранные</button> ' +
    '<button class="btn-secondary" onclick="closeRemoveFromAlbum()">Отмена</button></div></div>';
  var overlay = document.createElement('div');
  overlay.id = 'removeFromAlbumOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:2000;overflow-y:auto';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}

function closeRemoveFromAlbum() {
  var o = document.getElementById('removeFromAlbumOverlay');
  if (o) o.remove();
  _removeFromAlbumId = null;
  _removeFromAlbumPhotos = [];
}

async function _doRemoveFromAlbum() {
  if (!_removeFromAlbumId) return;
  var checkboxes = document.querySelectorAll('#removeFromAlbumOverlay input[type=checkbox]:checked');
  var photoIds = [];
  for (var i = 0; i < checkboxes.length; i++) photoIds.push(checkboxes[i].value);
  if (!photoIds.length) { closeRemoveFromAlbum(); return; }
  var resp = await fetch('/api/albums/' + encodeURIComponent(_removeFromAlbumId) + '/photos', {
    method: 'DELETE', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({photo_ids: photoIds})
  });
  var data = await resp.json();
  closeRemoveFromAlbum();
  if (data.ok) openAlbum(_removeFromAlbumId);
}
(function() {
  var params = new URLSearchParams(window.location.search);
  var albumId = params.get('album');
  if (albumId) openAlbum(albumId);
  else loadAlbums();
})();

</script>
