<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Альбомы — Gailery</title>
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/viewer.css">
<link rel="stylesheet" href="/face-modal.css">
<style>
body { font-family: monospace; background: #0d1117; color: #c9d1d9; }
.light-theme { background: #ffffff; color: #24292f; }
.album-bar { position: sticky; top: 0; z-index: 50; background: #161b22; border-bottom: 1px solid #30363d; padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.light-theme .album-bar { background: #f6f8fa; border-color: #d0d7de; }
.album-bar-title { font-size: 14px; font-weight: 600; color: #c9d1d9; cursor: pointer; padding: 2px 6px; border-radius: 4px; border: 1px solid transparent; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.album-bar-title:hover { border-color: #30363d; background: #0d1117; }
.light-theme .album-bar-title { color: #24292f; }
.light-theme .album-bar-title:hover { border-color: #d0d7de; background: #eaeef2; }
.album-bar-title-input { font-size: 14px; font-weight: 600; font-family: monospace; background: #0d1117; color: #c9d1d9; border: 1px solid #58a6ff; border-radius: 4px; padding: 2px 6px; max-width: 400px; }
.light-theme .album-bar-title-input { background: #fff; color: #24292f; }
.album-bar-meta { color: #6e7681; font-size: 11px; flex: 1; }
.light-theme .album-bar-meta { color: #57606a; }
.album-bar-desc-btn { padding: 4px 12px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 11px; white-space: nowrap; }
.album-bar-desc-btn:hover { border-color: #58a6ff; }
.light-theme .album-bar-desc-btn { background: #eaeef2; color: #24292f; border-color: #d0d7de; }
.album-desc-badge { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #d29922; margin-left: 4px; }
.light-theme .album-desc-badge { background: #d29922; }
.desc-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 1050; justify-content: center; align-items: center; }
.light-theme .desc-modal-bg { background: rgba(0,0,0,.5); }
.desc-modal-bg.show { display: flex; }
.desc-modal-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 90%; max-width: 500px; padding: 20px; }
.light-theme .desc-modal-box { background: #f6f8fa; border-color: #d0d7de; }
.desc-modal-box h3 { color: #58a6ff; margin: 0 0 12px; font-size: 15px; }
.light-theme .desc-modal-box h3 { color: #0969da; }
.desc-modal-box textarea { width: 100%; min-height: 120px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 13px; resize: vertical; box-sizing: border-box; }
.light-theme .desc-modal-box textarea { background: #fff; color: #24292f; border-color: #d0d7de; }
.desc-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.desc-modal-actions button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 12px; }
.light-theme .desc-modal-actions button { }
.desc-modal-save { background: #238636; color: #fff; }
.light-theme .desc-modal-save { background: #238636; }
.desc-modal-cancel { background: #21262d; color: #c9d1d9; }
.light-theme .desc-modal-cancel { background: #eaeef2; color: #24292f; border: 1px solid #d0d7de; }
.album-desc-text { color: #8b949e; font-size: 12px; line-height: 1.5; padding: 8px 16px; background: #161b22; border-bottom: 1px solid #21262d; }
.light-theme .album-desc-text { color: #57606a; background: #f6f8fa; border-color: #d0d7de; }

/* ─── Album card stack effect (real photos) ─── */
.grid-albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px; padding: 24px 20px; }
.album-card { position: relative; cursor: pointer; }
.ac-photo { position: absolute; inset: 0; border-radius: 4px; overflow: hidden; background: #161b22; border: 1px solid #30363d; transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease; }
.ac-photo img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #21262d; }
.ac-photo .ac-no-cover { width: 100%; aspect-ratio: 1; background: #21262d; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #30363d; }
.ac-photo .ac-count { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.8); color: #c9d1d9; font-size: 11px; padding: 2px 8px; border-radius: 10px; z-index: 4; font-weight: 600; }
.ac-photo .ac-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px; background: linear-gradient(transparent, rgba(0,0,0,.85)); font-size: 10px; line-height: 1.4; z-index: 3; pointer-events: none; }
.ac-photo .ac-overlay .date { color: #8b949e; }
.ac-photo .ac-overlay .desc { color: #c9d1d9; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ac-spread { position: relative; width: 100%; aspect-ratio: 1; }
.ac-back-2 { z-index: 0; transform: translate(6px, 6px) rotate(-2.5deg); }
.ac-back-1 { z-index: 1; transform: translate(3px, 3px) rotate(1.5deg); }
.ac-front { z-index: 2; transform: none; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.album-card:hover .ac-back-2 { transform: translate(16px, 6px) rotate(-12deg); box-shadow: -6px 4px 14px rgba(0,0,0,.4); }
.album-card:hover .ac-back-1 { transform: translate(-16px, 6px) rotate(12deg); box-shadow: 6px 4px 14px rgba(0,0,0,.4); }
.album-card:hover .ac-front { transform: translateY(-8px); box-shadow: 0 12px 28px rgba(0,0,0,.5); }
.ac-photo.ac-active { z-index: 10; transform: translateY(-14px) scale(1.06) rotate(0deg); box-shadow: 0 16px 32px rgba(0,0,0,.6); }
.light-theme .ac-photo { background: #f6f8fa; border-color: #d0d7de; }
.light-theme .ac-photo img { background: #eaeef2; }
.light-theme .ac-photo .ac-no-cover { background: #eaeef2; color: #d0d7de; }
.light-theme .ac-photo .ac-overlay { background: linear-gradient(transparent, rgba(0,0,0,.75)); }
.light-theme .ac-photo .ac-overlay .date { color: #b1bac4; }
.light-theme .ac-photo .ac-overlay .desc { color: #fff; }
.light-theme .ac-front { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.light-theme .album-card:hover .ac-back-2 { box-shadow: -6px 4px 14px rgba(0,0,0,.15); }
.light-theme .album-card:hover .ac-back-1 { box-shadow: 6px 4px 14px rgba(0,0,0,.15); }
.light-theme .album-card:hover .ac-front { box-shadow: 0 12px 28px rgba(0,0,0,.2); }
.light-theme .ac-photo.ac-active { box-shadow: 0 16px 32px rgba(0,0,0,.25); }
@media (max-width: 480px) {
    .grid-albums { grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 10px 6px; }
    .album-card:hover .ac-back-2 { transform: translate(8px, 3px) rotate(-8deg); }
    .album-card:hover .ac-back-1 { transform: translate(-8px, 3px) rotate(8deg); }
    .album-card:hover .ac-front { transform: translateY(-4px); }
    .ac-photo.ac-active { transform: translateY(-8px) scale(1.04); }
}
</style>
</head>
<body>

<script src="/shared.js"></script>
<script>renderHeader('Альбомы', '<div class="search-bar">\
  <button onclick="generate()">Сгенерировать</button>\
  <button class="btn-secondary" onclick="clearAll()">Очистить все</button>\
  <span class="info-bar" style="padding:0;border:none;background:none;flex:1" id="albumCount"></span>\
</div>');</script>

<div id="content">
  <div class="empty">
    <p>Нет альбомов</p>
    <p>Нажмите «Сгенерировать» для авто-создания</p>
  </div>
</div>

<div class="detail-panel" id="detailPanel">
    <span class="dp-close" onclick="closeDetail()">&times;</span>
    <div id="dpContent"></div>
</div>

<div class="del-dialog" id="delDialog">
    <div class="dd-box">
        <p class="dd-title">Скрыть фото?</p>
        <p class="dd-hint">Фото станет невидимым. Вернуть можно в галерее через фильтр «Удалённые».</p>
        <div class="dd-btns">
            <button class="dd-confirm" onclick="confirmDel()">Скрыть</button>
            <button class="dd-cancel" onclick="cancelDel()">Отмена</button>
        </div>
    </div>
</div>

<div class="desc-modal-bg" id="albumDescModal">
    <div class="desc-modal-box">
        <h3>Описание альбома</h3>
        <textarea id="albumDescInput" placeholder="Введите описание альбома..."></textarea>
        <div class="desc-modal-actions">
            <button class="desc-modal-cancel" onclick="closeAlbumDescModal()">Отмена</button>
            <button class="desc-modal-save" onclick="saveAlbumDesc()">Сохранить</button>
        </div>
    </div>
</div>

<script src="/gallery-common.js"></script>
<script src="/viewer.js?v=9"></script>
<script src="/face-modal.js"></script>
<script src="/gallery-detail.js?v=39"></script>

<script>
var API = '/api';
var currentPhotos = [];

function videoSrc(p) {
    if (p.media_type === 'video' && p.needs_stream) {
        return API + '/photos/video_stream?path=' + encodeURIComponent(p.photo_id);
    }
    return p.photo_id ? (API + '/photos/?path=' + encodeURIComponent(p.photo_id)) : '';
}

function showReprocessModal(photoId) {
    alert('Переобработка доступна в галерее');
}

var currentAlbum = null;
var albumViewMode = false;

async function loadAlbums() {
  albumViewMode = false;
  currentPhotos = [];
  var resp = await fetch('/api/albums/');
  var albums = await resp.json();
  var el = document.getElementById('albumCount');
  if (el) el.textContent = albums.length + ' альбомов';

  if (!albums.length) {
    document.getElementById('content').innerHTML = '<div class="empty"><p>Нет альбомов</p><p>Нажмите «Сгенерировать» для авто-создания</p></div>';
    return;
  }

  var html = '<div class="grid-albums">' + albums.map(function(a) {
    var previews = a.preview_photos || [];
    var date = a.date_start ? a.date_start.slice(0,10) : '';
    var desc = esc(a.title);
    var meta = a.photo_count + ' фото · ' + date + ' · ' + esc(a.source);
    var classes = ['ac-front', 'ac-back-1', 'ac-back-2'];
    var photosHtml = '';
    for (var i = 0; i < previews.length && i < 3; i++) {
      var pid = previews[i];
      var img = '<img src="/api/photos/thumbnail?path=' + encodeURIComponent(pid) + '&size=md" loading="lazy">';
      var overlay = i === 0
        ? '<div class="ac-count">' + a.photo_count + '</div>' +
          '<div class="ac-overlay"><div class="desc">' + desc + '</div><div class="date">' + meta + '</div></div>'
        : '';
      photosHtml += '<div class="ac-photo ' + classes[i] + '" onclick="event.stopPropagation();openAlbum(\'' + a.album_id + '\')">' + img + overlay + '</div>';
    }
    if (!photosHtml) {
      photosHtml = '<div class="ac-photo ac-front"><div class="ac-no-cover">&#128247;</div><div class="ac-count">' + a.photo_count + '</div></div>';
    }
    return '<div class="album-card" onclick="openAlbum(\'' + a.album_id + '\')"><div class="ac-spread">' + photosHtml + '</div></div>';
  }).join('') + '</div>';

  document.getElementById('content').innerHTML = html;
  _initAlbumStackThrottle();
}

var _acLastSwitch = 0;
function _initAlbumStackThrottle() {
  var cards = document.querySelectorAll('.album-card');
  for (var i = 0; i < cards.length; i++) {
    (function(card) {
      var photos = card.querySelectorAll('.ac-photo');
      for (var j = 0; j < photos.length; j++) {
        photos[j].addEventListener('mouseenter', function() {
          var now = Date.now();
          if (now - _acLastSwitch < 300) return;
          _acLastSwitch = now;
          for (var k = 0; k < photos.length; k++) photos[k].classList.remove('ac-active');
          this.classList.add('ac-active');
        });
      }
      card.addEventListener('mouseleave', function() {
        for (var k = 0; k < photos.length; k++) photos[k].classList.remove('ac-active');
        _acLastSwitch = 0;
      });
    })(cards[i]);
  }
}

async function openAlbum(id) {
  albumViewMode = true;
  var resp = await fetch('/api/albums/' + id + '?full=true');
  var album = await resp.json();
  currentAlbum = album;

  var photos = album.photos || [];
  currentPhotos = photos;

  var photosHtml = '';
  if (photos.length) {
    photosHtml = '<div class="grid" id="grid">' + photos.map(function(p, idx) {
      return buildCardHtml(p, idx);
    }).join('') + '</div>';
    setTimeout(function() { _faceLoadEnabled = true; _observeThumbs(); }, 500);
  } else {
    photosHtml = '<div class="empty"><p>В альбоме нет фото</p></div>';
  }

  var meta = album.photo_count + ' фото \u00b7 ' + (album.date_start ? album.date_start.slice(0,10) : '') + (album.date_end ? ' \u2014 ' + album.date_end.slice(0,10) : '') + ' \u00b7 ' + esc(album.source);
  var hasDesc = album.description && album.description.trim();
  var descHtml = hasDesc ? '<div class="album-desc-text">' + esc(album.description) + '</div>' : '';
  document.getElementById('content').innerHTML =
    '<div class="album-bar">' +
    '<button class="btn-secondary" onclick="loadAlbums()">&#8592;</button>' +
    '<span class="album-bar-title" id="albumBarTitle" onclick="editAlbumTitle()" title="\u041a\u043b\u0438\u043a \u0434\u043b\u044f \u0440\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f">' + esc(album.title) + '</span>' +
    '<span class="album-bar-meta">' + meta + '</span>' +
    '<button class="album-bar-desc-btn" onclick="showAlbumDescModal()">\u041e\u043f\u0438\u0441\u0430\u043d\u0438\u0435' + (hasDesc ? '<span class="album-desc-badge"></span>' : '') + '</button>' +
    '</div>' + descHtml + photosHtml;
}

function editAlbumTitle() {
  var span = document.getElementById('albumBarTitle');
  if (!span || !currentAlbum) return;
  var t = currentAlbum.title || '';
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'album-bar-title-input'; inp.value = t; inp.id = 'albumBarTitle';
  span.parentNode.replaceChild(inp, span);
  inp.focus(); inp.select();
  inp.addEventListener('blur', function() { saveAlbumTitle(); });
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    if (e.key === 'Escape') { inp.value = t; inp.blur(); }
  });
}

function saveAlbumTitle() {
  var inp = document.getElementById('albumBarTitle');
  if (!inp || !currentAlbum || inp.tagName !== 'INPUT') return;
  var nt = inp.value.trim();
  if (!nt || nt === currentAlbum.title) { _restAT(currentAlbum.title || ''); return; }
  fetch('/api/albums/' + encodeURIComponent(currentAlbum.album_id), {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title: nt})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) { currentAlbum.title = nt; _restAT(nt); }
    else _restAT(currentAlbum.title || '');
  }).catch(function() { _restAT(currentAlbum.title || ''); });
}

function _restAT(t) {
  var inp = document.getElementById('albumBarTitle');
  if (!inp || inp.tagName !== 'INPUT') return;
  var sp = document.createElement('span');
  sp.className = 'album-bar-title'; sp.id = 'albumBarTitle';
  sp.title = '\u041a\u043b\u0438\u043a \u0434\u043b\u044f \u0440\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f';
  sp.setAttribute('onclick', 'editAlbumTitle()'); sp.textContent = t;
  inp.parentNode.replaceChild(sp, inp);
}

function showAlbumDescModal() {
  var m = document.getElementById('albumDescModal');
  var i = document.getElementById('albumDescInput');
  if (!m || !i || !currentAlbum) return;
  i.value = currentAlbum.description || '';
  m.classList.add('show');
  setTimeout(function() { i.focus(); }, 100);
}

function closeAlbumDescModal() {
  var m = document.getElementById('albumDescModal');
  if (m) m.classList.remove('show');
}

function saveAlbumDesc() {
  var i = document.getElementById('albumDescInput');
  if (!i || !currentAlbum) return;
  var desc = i.value.trim();
  fetch('/api/albums/' + encodeURIComponent(currentAlbum.album_id), {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({description: desc})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) { currentAlbum.description = desc; closeAlbumDescModal(); openAlbum(currentAlbum.album_id); }
  }).catch(function(e) { alert('\u041e\u0448\u0438\u0431\u043a\u0430: ' + e.message); });
}

async function generate() {
  var el = document.getElementById('albumCount');
  if (el) el.textContent = 'Генерация...';
  var resp = await fetch('/api/albums/generate', {method:'POST'});
  var data = await resp.json();
  if (data.ok) {
    alert('Создано альбомов: ' + data.created);
    loadAlbums();
  } else {
    alert('Ошибка: ' + JSON.stringify(data));
  }
}

async function clearAll() {
  if (!confirm('Удалить все альбомы?')) return;
  var resp = await fetch('/api/albums/clear', {method:'DELETE'});
  var data = await resp.json();
  if (data.ok) {
    loadAlbums();
  }
}

loadAlbums();
</script>
</body>
</html>
