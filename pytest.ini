[pytest]
markers =
    gpu: tests that require GPU (llama-server / InsightFace)
    ai: tests that call AI models (embed, search, describe, enrich)
    write: tests that write to database (require minidb fixture)
    destructive: tests that interact with real system services (MQTT stop, pipeline control)
    quality: code structure analytics (file sizes, complexity, duplication, dead code)
    security: SAST/SCA/fuzz security tests (bandit, pip-audit, hypothesis)
    arch: architectural invariant tests (coupling, God Object, import boundaries)
    router: router contract tests (all endpoints respond, no 404)
    executor: executor contract tests (registry completeness, stubs, cancellation)
    fuzz: fuzzing tests (hypothesis — path traversal, malformed input, oversized bodies)
    slow: tests that take >30s (excluded from default runs)
